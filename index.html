<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/webp" href="/bagworm-favicon.webp" />
	<link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#16150f" />
	<!-- Title, description, canonical and the rest are written per page by
	     scripts/prerender.ts, from src/seo.ts. -->
	<!--seo-->
	<script>
		document.documentElement.setAttribute("data-js", "");
		// First visit to the front page: Bagworm's greeting will cover it once
		// the script loads. Mark it now so the page stays blank until then
		// (index.css, the gate cover) instead of flashing up and vanishing.
		// greeting.ts reads the same key.
		try {
			if (location.pathname === "/" && localStorage.getItem("smiduweorc-greeted") !== "1") {
				document.documentElement.setAttribute("data-gate", "");
			}
		} catch (e) {
			/* storage blocked: greeting.ts skips the greeting too */
		}
		// theme.ts writes this key on every change.
		(function () {
			try {
				var raw = localStorage.getItem("smiduweorc-theme-colors");
				if (!raw) return;
				var c = JSON.parse(raw);
				var root = document.documentElement;
				var map = {
					bg: "--color-theme-bg",
					panel: "--color-theme-panel",
					border: "--color-theme-border",
					comment: "--color-theme-comment",
					textSecondary: "--color-theme-text-secondary",
					text: "--color-theme-text",
					textPrimary: "--color-theme-text-primary",
					accent: "--color-theme-accent",
				};
				for (var k in map) {
					if (typeof c[k] === "string") root.style.setProperty(map[k], c[k]);
				}
				if (typeof c.bg === "string") {
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute("content", c.bg);
				}
			} catch (e) {
				/* first visit or corrupt storage; CSS defaults apply */
			}
		})();
	</script>
</head>

<body>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
